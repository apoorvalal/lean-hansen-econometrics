name: Lean CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          lint: false
          test: false
          use-mathlib-cache: true

      - name: Check MetricsLib consumer import
        run: lake env lean tests/MetricsLibSmoke.lean

      - name: Build Mathlib text-style linter
        run: lake build @mathlib/lint-style

      - name: Run Mathlib text-style linter
        run: lake env .lake/packages/mathlib/.lake/build/bin/lint-style --github HansenEconometrics
